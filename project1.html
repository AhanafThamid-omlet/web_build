<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project One</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: black;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            font-family: Arial;
        }

        .page-nav {
            padding: 24px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            font-family: 'IBM Plex Mono', monospace;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            transition: color 0.3s, border-color 0.3s;
        }

        .back-btn:hover {
            color: white;
            border-color: white;
        }

        .page-name {
            font-family: "Dancing Script", cursive;
            color: white;
            font-size: clamp(22px, 3vw, 40px);
        }

        .page-content {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            width: 100%;
        }

        .page-title {
            font-family: "Dancing Script", cursive;
            font-size: clamp(36px, 6vw, 72px);
            color: white;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .project-tag {
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px 14px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            border-radius: 20px;
        }

        .page-body {
            font-family: 'IBM Plex Mono', monospace;
            color: rgba(255,255,255,0.75);
            font-size: clamp(13px, 1.3vw, 16px);
            line-height: 1.9;
        }

        .page-body p {
            margin-bottom: 24px;
        }

        .page-section-title {
            font-family: "Dancing Script", cursive;
            font-size: clamp(20px, 2.5vw, 32px);
            color: white;
            margin-bottom: 12px;
            margin-top: 32px;
        }

        .project-link {
            display: inline-block;
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 24px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: white;
            transition: border-color 0.3s, background 0.3s;
            border-radius: 4px;
        }

        .project-link:hover {
            border-color: white;
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <nav class="page-nav">
        <a href="index.html#work" class="back-btn">← Back</a>
        <div class="page-name">Ahanaf Tahmid</div>
    </nav>

    <div class="page-content">
        <h1 class="page-title">Project One</h1>

        <div class="project-tags">
            <span class="project-tag">HTML</span>
            <span class="project-tag">CSS</span>
            <span class="project-tag">JavaScript</span>
        </div>

        <div class="page-body">
            <p class="page-section-title">Overview</p>
            <p>Describe what this project is and what problem it solves.</p>

            <p class="page-section-title">How it Works</p>
            <p>Explain the technical side — what you built and how.</p>

            <p class="page-section-title">What I Learned</p>
            <p>What did this project teach you?</p>

            <a href="https://github.com/AhanafThamid-omlet" target="_blank" class="project-link">
                View on GitHub →
            </a>
        </div>
    </div>

    <script src="./cursor.js"></script>
</body>
</html>
